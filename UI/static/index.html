<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-label="Calculator app">
        <div class="screen-wrap">
          <div id="expression" class="expression">0</div>
          <div id="display" class="display">0</div>
        </div>

        <div class="keys">
          <button class="action" data-value="C">C</button>
          <button class="action" data-value="DEL">DEL</button>
          <button class="action" data-value="%">%</button>
          <button class="operator" data-value="/">÷</button>

          <button data-value="7">7</button>
          <button data-value="8">8</button>
          <button data-value="9">9</button>
          <button class="operator" data-value="*">×</button>

          <button data-value="4">4</button>
          <button data-value="5">5</button>
          <button data-value="6">6</button>
          <button class="operator" data-value="-">−</button>

          <button data-value="1">1</button>
          <button data-value="2">2</button>
          <button data-value="3">3</button>
          <button class="operator" data-value="+">+</button>

          <button class="wide" data-value="0">0</button>
          <button data-value=".">.</button>
          <button class="equals" data-value="=">=</button>
        </div>
      </section>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
